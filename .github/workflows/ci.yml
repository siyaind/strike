name: ci
on:
  push: { branches: [main, 'feat/**'] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { NEXT_TELEMETRY_DISABLED: '1' }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: strike }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (packages, api, glasses, companion)
        run: pnpm typecheck
      - name: Lint (ESLint + typescript-eslint + react-hooks)
        run: pnpm lint
      - name: Prisma schema + migrations (real Postgres service)
        run: pnpm prisma:validate && pnpm db:deploy
        env: { DATABASE_URL: 'postgresql://ci:ci@localhost:5432/strike' }
      - name: Unit + integration tests (Vitest, incl. Postgres persistence round-trip)
        run: pnpm test
        env: { STRIKE_TEST_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/strike' }
      - name: Build glasses app + package .ehpk
        run: pnpm pack:g2
      - name: Secret scan (repo must not contain private keys)
        run: |
          ! git grep -nE '(0x)?[0-9a-fA-F]{64}' -- ':!packages/hyperliquid/src/fixtures/*' ':!**/*.test.ts' ':!pnpm-lock.yaml' ':!evidence/**' ':!scripts/gen-hl-signing-fixtures.py' | grep -viE 'sha256|hash|connectionId|0x0{60}'
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, fixture API)
        run: pnpm e2e
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence, path: evidence/ }
